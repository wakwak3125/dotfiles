[tools]
bat = "latest"
bun = "latest"
codex = "latest"
fd = "latest"
# gh: aqua backend は GitHub attestations 検証が不安定なため ubi backend を明示。
"ubi:cli/cli[exe=gh]" = "latest"
uv = "latest"
go = "latest"
java = "21"
node = "latest"
rust = "latest"
starship = "latest"
tree-sitter = "latest"
ghq = "latest"
"github:k1LoW/git-wt" = "latest"
"github:ogulcancelik/herdr" = "latest"
stylua = "latest"
ruff = "latest"
golangci-lint = "latest"
# hunk (review-first terminal diff viewer): mise に brew backend は無く、
# 公式配布は npm (パッケージ名 hunkdiff / 実行ファイル名 hunk) と brew のみ。
# WSL/Linux でも同じ経路で入るよう npm backend を採用。
"npm:hunkdiff" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint_d" = "latest"
"npm:ccstatusline" = "latest"
